<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Protagonista · JSConnect Win Coverage</title>
  <link rel="stylesheet" href="../comun/tokens.css">
  <link rel="stylesheet" href="../comun/base.css">
  <link rel="stylesheet" href="protagonista.css">
</head>
<body>
  <div id="barra-prueba"></div>

  <main class="escena">
    <header class="escena__cabecera">
      <div class="marca">
        <span class="marca__logo" aria-hidden="true">JS</span>
        <div>
          <p class="marca__nombre">JSConnect Win Coverage</p>
          <p class="marca__sub">Variante 5 · Tarjeta protagonista</p>
        </div>
      </div>
      <h1 class="titulo">Cobertura y Score</h1>
    </header>

    <form id="formulario" class="formulario escena__formulario" novalidate>
      <div class="campo f-coord">
        <label for="coordenadas">Coordenadas (latitud, longitud):</label>
        <div class="campo__control">
          <input id="coordenadas" name="coordenadas" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="-11.956037, -77.040653">
          <button type="button" class="boton boton--icono" data-limpiar="coordenadas" aria-label="Borrar coordenadas">✕</button>
        </div>
        <p class="error" id="error-coordenadas" role="alert" hidden></p>
      </div>
      <div class="campo f-doc">
        <div class="campo__etiqueta">
          <label for="documento">Documento (DNI/RUC/CE):</label>
          <span class="chip" data-tipo-documento>Tipo: —</span>
        </div>
        <div class="campo__control">
          <input id="documento" name="documento" type="text" autocomplete="off" spellcheck="false" placeholder="8, 9 u 11 caracteres">
          <button type="button" class="boton boton--icono" data-limpiar="documento" aria-label="Borrar documento">✕</button>
        </div>
        <p class="error" id="error-documento" role="alert" hidden></p>
      </div>
      <button id="validar" type="submit" class="boton boton--primario boton--grande f-boton">VALIDAR</button>
      <p class="error f-error" id="error-general" role="alert" hidden></p>
    </form>

    <section class="heroe" data-veredicto data-estilo="secondary" data-expandido="false" aria-label="Veredicto" data-ocupado>
      <p class="heroe__etiqueta">Veredicto</p>
      <p class="heroe__texto" data-veredicto-texto>—</p>
      <p class="heroe__nota" data-veredicto-nota></p>

      <ul class="heroe__chips" aria-label="Cobertura, zona y score">
        <li>
          <article class="tarjeta chipcard" data-tarjeta="cobertura" data-estilo="secondary" aria-labelledby="t-cobertura">
            <h2 id="t-cobertura" class="tarjeta__etiqueta">Cobertura</h2>
            <p class="tarjeta__titulo" data-titulo>—</p>
            <p class="tarjeta__nota" data-nota></p>
          </article>
        </li>
        <li>
          <article class="tarjeta chipcard" data-tarjeta="zona" data-estilo="secondary" aria-labelledby="t-zona">
            <h2 id="t-zona" class="tarjeta__etiqueta">Zona</h2>
            <p class="tarjeta__titulo" data-titulo>—</p>
            <p class="tarjeta__nota" data-nota></p>
          </article>
        </li>
        <li>
          <article class="tarjeta chipcard" data-tarjeta="score" data-estilo="secondary" aria-labelledby="t-score">
            <h2 id="t-score" class="tarjeta__etiqueta">Score</h2>
            <p class="tarjeta__titulo" data-titulo>—</p>
            <p class="tarjeta__nota" data-nota></p>
          </article>
        </li>
      </ul>

      <div class="heroe__acciones">
        <button type="button" class="boton boton--primario animable" data-accion="consultar-score" command="show-modal" commandfor="confirmar-score" hidden>Consultar score</button>
        <button type="button" class="boton" data-accion="ver-detalle" command="show-modal" commandfor="detalle" disabled>Ver detalle</button>
        <button type="button" class="boton boton--expandir" data-expandir aria-expanded="false" aria-controls="detalle-panel">
          <span>Score y datos</span><span class="boton__flecha" aria-hidden="true">▾</span>
        </button>
      </div>
    </section>

    <section id="detalle-panel" class="detalle" aria-label="Score y datos del cliente" hidden>
      <article class="detalle__score" data-ocupado>
        <h2 class="subtitulo">Score</h2>
        <p class="detalle__numero" data-valor-score>—</p>
        <p class="rango" data-rango-linea>Rango: —</p>
        <div class="medidor" data-medidor></div>
        <ul class="leyenda" data-leyenda aria-label="Escala del score"></ul>
      </article>

      <article class="detalle__ficha" aria-labelledby="h-ficha">
        <div class="detalle__cabecera">
          <h2 id="h-ficha" class="subtitulo">Datos del cliente</h2>
          <span class="copiar">
            <button type="button" class="boton boton--sutil" command="--copy-all" commandfor="ficha-lista">📋 Copiar todo</button>
            <span class="tip" role="status"></span>
          </span>
        </div>
        <dl class="ficha" id="ficha-lista" data-ficha data-ocupado></dl>
      </article>
    </section>

    <p class="estado" role="status" data-estado>Estado: listo</p>
    <p class="aviso animable" data-aviso hidden></p>
  </main>

  <script src="../comun/datos.js" defer></script>
  <script src="../comun/nucleo.js" defer></script>
  <script src="protagonista.js" defer></script>
</body>
</html>
