[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",  # try/except amplio a proposito (hardware, red, captura)
    "S110",    # fallbacks opcionales silenciosos
    "DTZ005",  # timestamps locales en herramientas locales
    "FLY002",  # join legible de la direccion MAC
]